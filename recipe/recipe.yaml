schema_version: 1

context:
  version: "0.2.0"
  qgis_ltr_version: "3.44"  # adjust to current LTR

recipe:
  name: enmapbox-suite
  version: ${{ version }}

build:
  number: 2

outputs:
  # -------------------
  # Lite / core version
  # -------------------
  - package:
      name: enmapbox-lite
    build:
      noarch: generic
    requirements:
      run:
        - python >=3.10
        - qgis >=${{ qgis_ltr_version }},<4
        - colorama
        - defusedxml
        - gdal
        - matplotlib-base
        - numba >=0.56.4
        - numpy
        - pyqtgraph
        - scikit-learn
        - skops
    tests:
      - python:
          imports:
            - qgis
            - osgeo.gdal
            - numba
          pip_check: false
      - script:
          - python -c "import os; os.environ['QT_QPA_PLATFORM']='offscreen'; from qgis.core import QgsApplication; app = QgsApplication([], False); app.initQgis(); print('QGIS OK'); app.exitQgis()"
  # ------------
  # Full version
  # ------------
  - package:
      name: enmapbox
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage('enmapbox-lite', exact=True) }}
        - astropy-base
        - catboost
        - enfrosp_enmapboxapp
        - enpt >=1.4.1
        - enpt_enmapboxapp >=1.2.0
        - h5py
        - lightgbm
        - lightning
        - netcdf4
        - opencv
        - pandas
        - pyopengl
        - pytorch
        - segmentation-models-pytorch
        - sympy
        - tensorboard
        - torchvision
        - xgboost
    tests:
      - python:
          imports:
            - qgis
            - osgeo.gdal
            - enpt
            - numba
          pip_check: true
      - script:
          - python -c "import os; os.environ['QT_QPA_PLATFORM']='offscreen'; from qgis.core import QgsApplication; app = QgsApplication([], False); app.initQgis(); print('QGIS OK'); app.exitQgis()"

about:
  license: GPL-3.0-only
  license_file: LICENSE.md
  summary: >
    Meta-package providing all conda dependencies required to run
    several versions of the EnMAP-Box QGIS plugin.
  description: |
    This is a conda meta-package that installs the runtime
    dependency stack defined in the EnMAP-Box conda environment
    files.

    The EnMAP-Box plugin itself is NOT included and must be installed
    via the QGIS Plugin Manager.
  homepage: https://github.com/EnMAP-Box/enmap-box
  repository: https://github.com/EnMAP-Box/enmap-box
  documentation: https://enmap-box.readthedocs.io/

extra:
  feedstock-name: enmapbox
  recipe-maintainers:
    - jakimowb
    - danschef
